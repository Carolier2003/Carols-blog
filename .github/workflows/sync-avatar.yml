name: Sync GitHub Avatar

on:
  schedule:
    # 每天凌晨 3 点运行（UTC）
    - cron: "0 3 * * *"
  workflow_dispatch: # 允许手动触发

# 仓库默认的 GITHUB_TOKEN 只有只读权限（Settings → Actions → General →
# Workflow permissions = Read repository contents）。不在这里显式声明
# contents: write，checkout 注入的就是只读 token，git push 必然 403。
permissions:
  contents: write

jobs:
  sync-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download avatar from GitHub
        # 下载到 /tmp，不直接覆盖仓库文件，避免工作区被弄脏影响后续判断
        run: |
          curl -sfL -o /tmp/avatar.new.png "https://github.com/Carolier2003.png?size=200"
          file /tmp/avatar.new.png
          file /tmp/avatar.new.png | grep -q 'PNG image data' || { echo "::error::下载到的不是 PNG，疑似被网关/限流拦截"; exit 1; }

      - name: Check if avatar changed
        id: check
        # 按像素比较而不是按文件字节比较：GitHub 的头像 CDN 会重新编码 PNG
        # （同一张图、字节不同），用 git diff 判断会天天误报「有变化」。
        run: |
          if [ ! -f public/avatar.png ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v compare >/dev/null 2>&1; then
            diff_px=$(compare -metric AE public/avatar.png /tmp/avatar.new.png null: 2>&1 | awk '{print $1}')
          else
            cmp -s public/avatar.png /tmp/avatar.new.png && diff_px=0 || diff_px=1
          fi
          echo "不同像素数：${diff_px:-unknown}"
          if [ "${diff_px:-0}" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          cp /tmp/avatar.new.png public/avatar.png
          git add public/avatar.png
          git commit -m "chore: sync avatar from GitHub"
          git push
