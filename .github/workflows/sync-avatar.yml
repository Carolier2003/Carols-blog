name: Sync GitHub Avatar

on:
  schedule:
    # 每天凌晨 3 点运行（UTC）
    - cron: "0 3 * * *"
  workflow_dispatch: # 允许手动触发

# 仓库默认的 GITHUB_TOKEN 只有只读权限（Settings → Actions → General →
# Workflow permissions = Read repository contents）。不在这里显式声明
# contents: write，checkout 注入的就是只读 token，git push 必然 403。
permissions:
  contents: write

jobs:
  sync-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download avatar from GitHub
        # 下载到 /tmp，不直接覆盖仓库文件：避免工作区被弄脏后 git diff 判断失真
        run: |
          curl -sfL -o /tmp/avatar.new.png "https://github.com/Carolier2003.png?size=200"
          file /tmp/avatar.new.png
          file /tmp/avatar.new.png | grep -q 'PNG image data' || { echo "::error::下载到的不是 PNG，疑似被网关/限流拦截"; exit 1; }

      - name: Check if avatar changed
        id: check
        # 按字节比较。GitHub 的 avatar CDN 偶尔会重新编码同一张图（像素不变、
        # 字节不同），那时会多产生一次无意义的提交，随后重新稳定。
        # 若要严格按像素判断，需先装 Pillow 或 ImageMagick（runner 默认两者都没有）。
        run: |
          if [ ! -f public/avatar.png ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s public/avatar.png /tmp/avatar.new.png; then
            echo "avatar 未变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "avatar 有变化"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          cp /tmp/avatar.new.png public/avatar.png
          git add public/avatar.png
          git commit -m "chore: sync avatar from GitHub"
          git push
